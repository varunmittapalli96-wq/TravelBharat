databases:
  - name: travelbharat-db
    databaseName: travelbharat
    user: travelbharat
    region: oregon
    plan: free
    ipAllowList: []

services:
  # 1. Backend API Web Service
  - type: web
    name: travelbharat-api
    runtime: node
    region: oregon
    plan: free
    buildCommand: npm install --include=dev && npm run build --workspace=packages/shared && cd apps/api && npx prisma generate && npm run build
    startCommand: cd apps/api && npx prisma db push && npm run seed && npm run start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: travelbharat-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: API_PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CORS_ORIGINS
        value: "*"
      - key: ADMIN_EMAIL
        value: admin@travelbharat.in
      - key: ADMIN_PASSWORD
        value: Admin@TravelBharat2024!

  # 2. Frontend Next.js Web Service
  - type: web
    name: travelbharat-web
    runtime: node
    region: oregon
    plan: free
    buildCommand: npm install --include=dev && npm run build --workspace=packages/shared && cd apps/web && npm run build
    startCommand: cd apps/web && npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_SITE_URL
        value: https://travelbharat-web.onrender.com
      - key: NEXT_PUBLIC_API_URL
        value: https://travelbharat-api-ne4e.onrender.com/api/v1

