services:
  db:
    image: postgres:16-alpine
    container_name: travelbharat-db
    environment:
      POSTGRES_USER: travelbharat
      POSTGRES_PASSWORD: travelbharat
      POSTGRES_DB: travelbharat
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U travelbharat"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
